name: Swap to Light Garden

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/swap.yml"

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and remove this workflow
        run: |
          mv bloom-and-burn.html index.html
          rm .github/workflows/swap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update website to Light Garden design - replace index.html"
          git push
