name: Rename site file
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new export
        run: |
          rm -f index.html
          mv bloom-and-burn.html index.html
          rm -f .github/workflows/rename-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update website — rephrased Morning Tips"
          git push
