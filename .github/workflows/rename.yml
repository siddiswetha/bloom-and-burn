name: Rename export to index
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and clean up
        run: |
          if [ -f bloom-and-burn.html ]; then
            rm -f index.html
            mv bloom-and-burn.html index.html
            rm -f .github/workflows/rename.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update website - latest Bloom and Burn export"
            git push
          fi
